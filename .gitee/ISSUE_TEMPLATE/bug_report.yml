name: Bug 反馈
description: 当你在代码中发现了一个 Bug，导致应用崩溃或抛出异常，或者某个组件存在问题
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢对项目的支持与关注。在提出问题之前，请确保你已查阅相关文档：
        - [WPF UI 文档](https://wpfui.lepo.co/documentation/)
        - [已有 Issues](https://gitee.com/lepo/wpf-ui/issues)
  - type: checkboxes
    attributes:
      label: 这个问题是否已经存在？
      options:
        - label: 我已经搜索过现有的 Issues
          required: true
  - type: textarea
    validations:
      required: true
    attributes:
      label: 描述 Bug
      description: 清晰简洁地描述这个 Bug 是什么
  - type: textarea
    validations:
      required: true
    attributes:
      label: 复现步骤
      description: 详细描述复现该问题的步骤，如涉及代码，请提供最小代码示例
      placeholder: |
        1. ...
        2. ...
        3. ...
  - type: textarea
    validations:
      required: true
    attributes:
      label: 预期行为
      description: 清晰简洁地描述你预期会发生什么
  - type: textarea
    attributes:
      label: 实际行为
      description: 清晰简洁地描述实际发生了什么
  - type: textarea
    attributes:
      label: 截图或视频
      description: 如果可以的话，上传相关截图或视频
      value: |
        [在这里上传图片]
  - type: textarea
    validations:
      required: true
    attributes:
      label: 操作系统版本
      description: 你当前正在使用哪个操作系统版本？
  - type: textarea
    validations:
      required: true
    attributes:
      label: .NET 版本
      description: 你当前正在使用哪个 .NET 版本？
  - type: textarea
    validations:
      required: true
    attributes:
      label: WPF-UI NuGet 版本
      description: 你当前正在使用哪个 WPF-UI NuGet 版本？
  - type: textarea
    attributes:
      label: 补充说明
      description: 添加关于此问题的任何其他上下文
